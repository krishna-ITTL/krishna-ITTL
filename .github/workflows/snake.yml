name: Generate snake

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake.svg?color_snake=#00e5ff&color_dots=#0a1a33,#0a3d62,#00a8c6,#00e5ff,#ffb300
            dist/snake-dark.svg?palette=github-dark&color_snake=#00e5ff&color_dots=#0a1a33,#0a3d62,#00a8c6,#00e5ff,#ffb300

      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
